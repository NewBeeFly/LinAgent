server:
  port: 9018

spring:
  application:
    name: lin-agent
  profiles:
    active: local
  datasource:
    # stringtype=unspecified：允许实体 String 字段直写 JSONB 列（turn.usage / message.arguments）。
    # host/库名可用环境变量覆盖；profile 配置（如 application-local.yml）可整体覆盖 url（需自带该参数）。
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:linagent}?stringtype=unspecified
  ai:
    openai:
      api-key: ${STEPFUN_API_KEY:}
      base-url: https://api.stepfun.com/step_plan
      chat:
        options:
          model: step-3.7-flash
  flyway:
    enabled: true
    locations: classpath:db/migration
agent:
  skills-root: ./skills
  workspace-root: ./workspace
  compaction:
    # threshold-tokens 不配置（默认 -1）时 = max-context-tokens × trigger-ratio（显式配置优先，
    # 演示/测试可命令行覆盖：--agent.compaction.threshold-tokens=2000）
    max-context-tokens: 262144   # step-3.7-flash 上下文窗口 256K
    trigger-ratio: 0.8           # 估算达窗口 80% 触发压缩
    keep-turns: 20
    summary-timeout-seconds: 60
    chars-per-token: 2
