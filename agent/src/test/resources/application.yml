# agent 模块测试专用配置（仅 test classpath，不会打进 agent jar，也不影响 web 模块配置）。
# api-key 不入库，运行 manual 探针时通过环境变量 STEPFUN_API_KEY 注入。
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/linagent
    username: ${DB_USERNAME:postgres}
    # 密码走环境变量占位，公开仓库不含个人本机凭据——本地跑 DB 相关测试请 export DB_USERNAME / DB_PASSWORD
    password: ${DB_PASSWORD:postgres}
  ai:
    openai:
      api-key: ${STEPFUN_API_KEY:}
      base-url: https://api.stepfun.com/step_plan
      chat:
        options:
          model: step-3.7-flash
